<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon" href="calcLogo.png" type="image/png">
    <style>
        :root {
            --bg-color: ivory;
            --text-color: black;
            --button-bg: beige;
            --button-text: black;
            --button-border: #999;
        }
        
        .dark-mode {
            --bg-color: black;
            --text-color: goldenrod;
            --button-bg: black;
            --button-text: white;
            --button-border: goldenrod;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            text-align: center;
            transition: background 1s, color 2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 105vh;
            margin: 0;
        }
        
        .calculator {
            width: 250px;
            padding: 15px;
            border-radius: 10px;
            background-color: var(--button-bg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .display {
            width: 90%;
            height: 50px;
            font-size: 22px;
            text-align: center;
            margin-bottom: 10px;
            padding: 8px;
            border: 2px solid var(--button-border);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 5px;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        
        button {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid var(--button-border);
            cursor: pointer;
            background-color: var(--button-bg);
            color: var(--button-text);
            border-radius: 6px;
        }
        
        button:active {
            opacity: 0.7;
        }
        
        .toggle-button, .home-button {
            margin-bottom: 15px;
            padding: 8px 16px;
            border: 2px solid var(--button-border);
            cursor: pointer;
            background-color: var(--button-bg);
            color: var(--text-color);
            font-size: 14px;
            border-radius: 8px;
            font-weight: bold;
        }
        
        .history-container {
            margin-top: 15px;
            width: 250px;
            background-color: var(--button-bg);
            border-radius: 10px;
            padding: 8px;
            display: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .history-container h3 {
            margin: 0;
            text-align: center;
            padding: 8px;
        }


        button:hover{
            background-image: linear-gradient(90deg, 
    #FFD700 0%,  /* Gold */
    #FFA500 25%, /* Orange */
    #000000 50%, /* Orange-Red */
    #DC143C 75%, /* Crimson */
    #d40101 100% /* Dark Red */
  );
  background-size: 300% 300%;
  background-position: left;
  -webkit-background-clip: text; 
  background-clip: text;
  color: transparent; 
  animation: gradientShift 1s linear infinite alternate;
}

@keyframes gradientShift {
  0% { background-position: left; }
  100% { background-position: right; }
}


@keyframes animate{
  to {
      background-position-x: -200px;

  }

        }
    </style>
</head>
<body>
    <button class="home-button" onclick="goHome()">Home</button>
    <button class="toggle-button" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    <div class="calculator">
        <input type="text" class="display" id="display" disabled>
        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendToDisplay('%')">%</button>
            <button onclick="appendToDisplay('/')">/</button>
            <button onclick="appendToDisplay('*')">*</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('-')">-</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('+')">+</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="calculateResult()">=</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="deleteLastChar()">⌫</button>
            <button onclick="toggleHistory()">📜</button>
        </div>
    </div>
    
    <div class="history-container" id="history">
        <h3>Calculation History</h3>
        <ul id="history-list"></ul>
    </div>
    
    <script>
        let history = [];
        
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
        
        function goHome() {
            window.location.href = "index.html";
        }
        
        function appendToDisplay(value) {
            document.getElementById("display").value += value;
        }
        
        function clearDisplay() {
            document.getElementById("display").value = "";
        }
        
        function deleteLastChar() {
            let display = document.getElementById("display");
            display.value = display.value.slice(0, -1);
        }
        
        function calculateResult() {
            try {
                let expression = document.getElementById("display").value;
                let result = eval(expression);
                document.getElementById("display").value = result;
                history.push(expression + " = " + result);
                updateHistory();
            } catch (e) {
                alert("Invalid expression");
            }
        }
        
        function updateHistory() {
            let historyList = document.getElementById("history-list");
            historyList.innerHTML = "";
            history.forEach(entry => {
                let listItem = document.createElement("li");
                listItem.textContent = entry;
                historyList.appendChild(listItem);
            });
        }
        
        function toggleHistory() {
            let historyContainer = document.getElementById("history");
            historyContainer.style.display = historyContainer.style.display === "none" ? "block" : "none";
        }
    </script>
</body>
</html>
