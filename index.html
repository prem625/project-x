<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Vault</title>
    <style>
        :root {
            --bg-color: ivory;
            --text-color: black;
            --icon-bg: beige;
        }
        
        .dark-mode {
            --bg-color: black;
            --text-color: goldenrod;
            --icon-bg: darkgoldenrod;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            text-align: center;
            transition: background 0.3s, color 0.3s;
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }
        
        .app-icon {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--icon-bg);
            border-radius: 15px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: var(--text-color);
        }
        
        .toggle-button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            background-color: var(--icon-bg);
            color: var(--text-color);
            font-size: 16px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>App Vault</h1>
    <button class="toggle-button" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    <div class="container">
        <a href="calculator.html" class="app-icon">Calculator</a>
        <a href="music.html" class="app-icon">Music Player</a>
        <a href="notes.html" class="app-icon">Notes</a>
        <a href="todo.html" class="app-icon">To-Do</a>
    </div>
    
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>
</body>
</html>
