<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Vault</title>
  <style>
    /* Base styles */
    * {
      margin: 0;
      padding: 0.6%;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.5s, color 0.5s;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .light-mode {
      background-color: #fffff0; /* ivory */
      color: #000000;
    }

    .dark-mode {
      background-color: #000000;
      color: #D59900; /* amber */
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header styles */
    header {
      padding: 2rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      transform: translateY(-10px);
      animation: fade-in 0.7s ease-out forwards 0.3s;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: bold;
    }

    /* Mode toggle button */
    .mode-toggle {
      background: none;
      border: none;
      cursor: pointer;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: background-color 0.3s, transform 0.3s;
    }

    .light-mode .mode-toggle {
      background-color: #f5f5dc; /* beige */
    }

    .dark-mode .mode-toggle {
      background-color: rgba(53, 45, 26, 0.3); /* amber-900/30 */
    }

    .mode-toggle:hover {
      transform: scale(1.1);
    }

    .bulb-container {
      position: relative;
      animation: float 3s ease-in-out infinite;
    }

    .bulb-icon {
      font-size: 28px;
      display: inline-block;
    }

    .dark-mode .bulb-icon {
      animation: glow 1s ease-in-out infinite;
    }

    /* Main content styles */
    main {
      width: 100%;
    }

    /* Title container with hover effect */
    .title-container {
      position: relative;
      margin: 4px 0;
      cursor: pointer;
      display: flex;
      justify-content: center;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.9);
      animation: scale-in 0.8s ease-out forwards 0.3s;
    }

    .title-part {
      font-size: 5rem;
      font-weight: 800;
      display: inline-block;
      transition: all 0.5s;
    }

    .left {
      transform-origin: right center;
      font-size: 8rem;
      color: #D59900;
    }

    .right {
  transform-origin: left center;
  background-image: linear-gradient(90deg, 
    #FFD700 0%,  /* Gold */
    #FFA500 25%, /* Orange */
    #000000 50%, /* Orange-Red */
    #DC143C 75%, /* Crimson */
    #d40101 100% /* Dark Red */
  );
  background-size: 300% 300%;
  background-position: left;
  -webkit-background-clip: text; 
  background-clip: text;
  color: transparent; 
  animation: gradientShift 5s linear infinite alternate;
}

@keyframes gradientShift {
  0% { background-position: left; }
  100% { background-position: right; }
}


@keyframes animate{
  to {
      background-position-x: -200px;

  }


}

    .title-container:hover .left {
      transform: translateX(-40px) rotate(12deg);
      opacity: 0.2;
    }

    .title-container:hover .right {
      transform: translateX(40px) rotate(-12deg);
      opacity: 0.2;
    }

    /* Apps grid */
    .apps-grid {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-51%, -0%) scale(25);
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 120px);
      gap: 1.25rem;
      justify-content: center;
      opacity: 0;
      transition: all 1s;
    }

    @media (min-width: 768px) {
      .apps-grid {
        grid-template-columns: repeat(4, 120px);
      }
    }

    .title-container:hover .apps-grid {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .app-item {
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.75rem;
      font-weight: bold;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, rotate 0.3s;
    }

    .light-mode .app-item {
      background-color: #f5f5dc; /* beige */
    }

    .dark-mode .app-item {
      background-color: rgba(53, 45, 26, 0.3); /* amber-900/30 */
    }

    .app-item:hover {
      transform: scale(1.1) rotate(3deg);
      background-image: linear-gradient(90deg, 
    #FFD700 0%,  /* Gold */
    #FFA500 25%, /* Orange */
    #000000 50%, /* Orange-Red */
    #DC143C 75%, /* Crimson */
    #d40101 100% /* Dark Red */
  );
  background-size: 300% 300%;
  background-position: left;
  -webkit-background-clip: text; 
  background-clip: text;
  color: transparent; 
  animation: gradientShift 1s linear infinite alternate;
}

@keyframes gradientShift {
  0% { background-position: left; }
  100% { background-position: right; }
}


@keyframes animate{
  to {
      background-position-x: -200px;

  }
}


    /* Widget styles */
    .widget-container {
      display: flex;
      justify-content: center;
      margin-top: 4rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fade-in-up 0.7s ease-out forwards 0.6s;
    }

    .widget {
      width: 256px;
      height: 160px;
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }

    .light-mode .widget {
      background-color: #f5f5dc; /* beige */
    }

    .dark-mode .widget {
      background-color: rgba(53, 45, 26, 0.3); /* amber-900/30 */
    }

    .widget:hover {
      transform: scale(1.05);
    }

    .time {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 0.5rem 0;
      animation: pulse 2s infinite;
    }

    /* Animations */
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes glow {
      0%, 100% {
        filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0));
      }
      50% {
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scale-in {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
    }
  </style>
</head>
<body class="light-mode">
  <div class="container">
    <header>
      <h1>App Vault</h1>
      <button id="mode-toggle" class="mode-toggle" aria-label="Toggle dark mode">
        <div class="bulb-container">
          <span id="bulb-icon" class="bulb-icon">💡</span>
        </div>
      </button>
    </header>

    <main>
      <div class="title-container" id="title-container">
        <div class="title-part left">PRO</div>
        <div class="title-part right">JECT X</div>
        
        <div class="apps-grid">
            <a href="calculator.html" class="app-item" target="_blank">Calculator</a>
            <a href="music.html" class="app-item" target="_blank">Music Player</a>
            <a href="notes.html" class="app-item" target="_blank">Notes</a>
            <a href="todo.html" class="app-item" target="_blank">To-Do</a>
          </div>
      </div>

      <div class="widget-container">
        <div class="widget">
          <p id="date">Loading date...</p>
          <p id="time" class="time">Loading time...</p>
          <p id="weather">Fetching weather...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Wait for the DOM to load
    document.addEventListener('DOMContentLoaded', function() {
      // Get elements
      const body = document.body;
      const modeToggle = document.getElementById('mode-toggle');
      const bulbIcon = document.getElementById('bulb-icon');
      const dateElement = document.getElementById('date');
      const timeElement = document.getElementById('time');
      const weatherElement = document.getElementById('weather');
      
      // Initialize dark mode from localStorage if available
      if (localStorage.getItem('darkMode') === 'true') {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
        bulbIcon.textContent = '🔅'; // dimmed bulb for dark mode
      }
      
      // Toggle dark mode function
      function toggleDarkMode() {
        if (body.classList.contains('light-mode')) {
          body.classList.remove('light-mode');
          body.classList.add('dark-mode');
          bulbIcon.textContent = '🔅'; // dimmed bulb for dark mode
          localStorage.setItem('darkMode', 'true');
        } else {
          body.classList.remove('dark-mode');
          body.classList.add('light-mode');
          bulbIcon.textContent = '💡'; // bright bulb for light mode
          localStorage.setItem('darkMode', 'false');
        }
      }
      
      // Add event listener to dark mode toggle button
      modeToggle.addEventListener('click', toggleDarkMode);
      
      // Update date and time
      function updateDateTime() {
        const now = new Date();
        dateElement.textContent = now.toDateString();
        timeElement.textContent = now.toLocaleTimeString();
      }
      
      // Fetch weather data
      async function fetchWeather() {
        try {
          const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=37.7749&longitude=-122.4194&current_weather=true"
          );
          const data = await response.json();
          const temp = data.current_weather.temperature;
          weatherElement.textContent = `🌡 ${temp}°C`;
        } catch (error) {
          weatherElement.textContent = "Weather unavailable";
          console.error("Failed to fetch weather:", error);
        }
      }
      
      // Initialize data
      updateDateTime();
      fetchWeather();
      
      // Update time every second
      setInterval(updateDateTime, 1000);
    });
  </script>
</body>
</html>
