<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Vault</title>
    <style>
        :root {
            --bg-color: ivory;
            --text-color: black;
            --icon-bg: beige;
        }
        
        .dark-mode {
            --bg-color: black;
            --text-color: rgb(213, 153, 0);
            --icon-bg: rgb(53, 45, 26);
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            text-align: center;
            transition: background 0.3s, color 0.3s;
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }
        
        .app-icon {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--icon-bg);
            border-radius: 15px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: var(--text-color);
        }

        .widget {
            width: 220px;
            height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--icon-bg);
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            margin-top: 20px;
            margin-left: 630px;
        }

        .time {
            font-size: 20px;
            font-weight: bold;
        }

        .toggle-button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            background-color: var(--icon-bg);
            color: var(--text-color);
            font-size: 16px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>App Vault</h1>
    <button class="toggle-button" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    <div class="container">
        <a href="calculator.html" class="app-icon">Calculator</a>
        <a href="music.html" class="app-icon">Music Player</a>
        <a href="notes.html" class="app-icon">Notes</a>
        <a href="todo.html" class="app-icon">To-Do</a>
    </div>
    
    <div class="widget">
        <p id="date"></p>
        <p class="time" id="time"></p>
        <p id="weather">Fetching weather...</p>
    </div>
    
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        function updateTime() {
            let now = new Date();
            document.getElementById("date").textContent = now.toDateString();
            document.getElementById("time").textContent = now.toLocaleTimeString();
        }

        async function getWeather() {
            try {
                let response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.7749&longitude=-122.4194&current_weather=true");
                let data = await response.json();
                let temp = data.current_weather.temperature;
                document.getElementById("weather").textContent = `🌡 ${temp}°C`;
            } catch (error) {
                document.getElementById("weather").textContent = "Weather unavailable";
            }
        }

        setInterval(updateTime, 1000);
        updateTime();
        getWeather();
    </script>
</body>
</html>
