<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="icon" href="musicLogo.png" type="image/png">
    <style>
        :root {
        
            --bg-color: ivory;
            --text-color: black;
            --button-bg: beige;
            --button-text: black;
    
            --accent-color:white; 
            --card-bg: white; 
            --hover-bg: white;
        }
        .dark-mode {
          
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --button-bg: #1f1f1f; 
            --button-text: #ffffff;
            --accent-color: goldenrod;
            --card-bg: gray; 
            --hover-bg: black;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            font-family: 'Arial', sans-serif;
            transition: background 1s, color 2s;
            display: flex;
            flex-direction: column;
            height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        .container {
            display: flex;
            width: 100%;
            max-width: 800px;
            height: 70vh;
            background: var(--button-bg);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 1s ease-in-out;
        }
        .player-container {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--button-bg);
        }
        .song-list-container {
            width: 50%;
            overflow-y: auto;
            max-height: 100%;
            padding: 20px;
            background: var(--button-bg);
        }
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Space between song cards */
        }
        .song-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            transition: transform 1s, background 2s;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .song-card:hover {
            transform: scale(1.02);
            background: var(--hover-bg);
            background-image: linear-gradient(90deg, 
    #FFD700 0%,  /* Gold */
    #FFA500 25%, /* Orange */
    #000000 50%, /* Orange-Red */
    #DC143C 75%, /* Crimson */
    #d40101 100% /* Dark Red */
  );
  background-size: 300% 300%;
  background-position: left;
  -webkit-background-clip: text; 
  background-clip: text;
  color: transparent; 
  animation: gradientShift 1s linear infinite alternate;
}

@keyframes gradientShift {
  0% { background-position: left; }
  100% { background-position: right; }
}


@keyframes animate{
  to {
      background-position-x: -200px;

  }
}


/* ---------------------------------------------------------------------------------------------- */

        .song-title {
            font-size: 18px;
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            background-color: var(--accent-color);
            color: var(--button-text);
            border-radius: 5px;
            margin-top: 10px;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background-color: var(--hover-bg);
            transform: scale(1.05);
        }
        .toggle-button {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            animation: fadeIn 1s ease-in-out;
        }
        .home-button {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <button class="home-button" onclick="goHome()">Home</button>
    <button class="toggle-button" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    <div class="container">
        <div class="player-container">
            <h2>Music Player</h2>
            <audio id="audio" controls>
                <source src="sample.mp3" type="audio/mpeg">
                Your browser does not support the audio tag.
            </audio>
            <button onclick="playMusic()">Play</button>
            <button onclick="pauseMusic()">Pause</button>
        </div>
        <div class="song-list-container">
            <h2>Playlist</h2>
            <div class="song-list" id="song-list"></div>
        </div>
    </div>
    <script>
        const audio = document.getElementById("audio");
        const songList = document.getElementById("song-list");
       
        const songs = [
            { name: "Kitni Bechain Hoke", src: "kitni bechain hoke.mp3" },
            { name: " baat itni si hai", src: "baat itni si hai.mp3" },
            { name: " chaahat", src: "chaahat.mp3" },
            { name: " dil ke taj mahal me", src: "dil ke taj mahal me.mp3" },
            { name: " hansta hua noorani chehra", src: "hansta hua noorani chehra.mp3" },
            { name: " joganiya", src: "joganiya.mp3" },
            { name: " kurban", src: "kurban.mp3" },
            { name: " lkhe jo khat tujhe", src: "lkhe jo khat tujhe.mp3" },
            { name: " mausam hai bada qatil", src: "mausam hai bada qatil.mp3" },
            { name: " milo na tum to", src: "milo na tum to.mp3" },
            { name: " volume 1", src: "volume 1.mp3" },
            { name: " chali kahani", src: "chali kahani.mp3" }
          
        ];
       
        function loadSongs() {
            songs.forEach(song => {
                let card = document.createElement("div");
                card.className = "song-card";
                card.innerHTML = `<span class="song-title">${song.name}</span>`;
                card.onclick = () => playSelectedSong(song.src);
                songList.appendChild(card);
            });
        }
       
        function playSelectedSong(src) {
            audio.src = src;
            audio.play();
        }
       
        function playMusic() {
            audio.play();
        }
       
        function pauseMusic() {
            audio.pause();
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        function goHome() {
            
            alert("Home button clicked!");
            window.location.href = "index.html";
        }
       
        loadSongs();
    </script>
</body>
</html>
