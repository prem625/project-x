<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
   
    <style>
        :root {
            --bg-color: ivory;
            --text-color: black;
            --button-bg: beige;
            --button-text: black;
        }
        .dark-mode {
            --bg-color: black;
            --text-color: goldenrod;
            --button-bg: darkgoldenrod;
            --button-text: white;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            font-family: Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .container {
            display: flex;
            width: 80%;
            height: 70vh;
            background: var(--button-bg);
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            animation: fadeIn 1s ease-in-out;
        }
        .player-container {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--button-bg);
            animation: slideInLeft 1s ease-in-out;
        }
        .song-list-container {
            width: 50%;
            overflow-y: auto;
            max-height: 100%;
            padding: 20px;
            background: var(--button-bg);
            animation: slideInRight 1s ease-in-out;
        }
        .song-list button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background: var(--button-bg);
            color: var(--button-text);
            transition: background 0.3s;
        }
        .song-list button:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }
        button {
            padding: 10px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            background-color: var(--button-bg);
            color: var(--button-text);
            border-radius: 5px;
            margin-top: 10px;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            transform: scale(1.05);
        }
        .toggle-button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            animation: fadeIn 1s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="lottie-animation" class="background-animation"></div>
    <button class="toggle-button" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    <div class="container">
        <div class="player-container">
            <h2>Music Player</h2>
            <audio id="audio" controls>
                <source src="sample.mp3" type="audio/mpeg">
                Your browser does not support the audio tag.
            </audio>
            <button onclick="playMusic()">Play</button>
            <button onclick="pauseMusic()">Pause</button>
        </div>
        <div class="song-list-container">
            <h2>Playlist</h2>
            <div class="song-list" id="song-list"></div>
        </div>
    </div>
    <script>
        const audio = document.getElementById("audio");
        const songList = document.getElementById("song-list");
        
        const songs = [
            { name: "kitni bechain hoke", src: "kitni bechain hoke.mp3" },
            { name: "Song Two", src: "song2.mp3" },
            { name: "Song Three", src: "song3.mp3" },
            { name: "Song Four", src: "song4.mp3" },
            { name: "Song Five", src: "song5.mp3" }
        ];
        
        function loadSongs() {
            songs.forEach(song => {
                let btn = document.createElement("button");
                btn.innerText = song.name;
                btn.onclick = () => playSelectedSong(song.src);
                songList.appendChild(btn);
            });
        }
        
        function playSelectedSong(src) {
            audio.src = src;
            audio.play();
        }
        
        function playMusic() {
            audio.play();
        }
        
        function pauseMusic() {
            audio.pause();
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
        
      
        
        loadSongs();
    </script>
</body>
</html>
