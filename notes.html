<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="icon" href="notesLogo.jpg" type="image/jpg">
    <style>
        :root {
            --bg-color: ivory;
            --text-color: black;
            --button-bg: beige;
            --button-text: black;
        }
        .dark-mode {
            --bg-color: black;
            --text-color: goldenrod;
            --button-bg: black;
            --button-text: white;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            font-family: Arial, sans-serif;
            transition: background 1.3s, color 3s;
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
            text-align: left;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--text-color);
            background: var(--button-bg);
            color: var(--text-color);
            resize: none;
        }
        button {
            padding: 10px 15px;
            margin-top: 10px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }
        .toggle-button {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .home-button {
            position: absolute;
            top: 10px;
            left: 10px;
        }
    </style>
</head>
<body>
    <button class="home-button" onclick="goHome()">Home</button>
    <button class="toggle-button" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    <div class="container">
        <h2>Notes</h2>
        <textarea id="note" placeholder="Write your notes here..."></textarea>
        <button onclick="saveNote()">Save Note</button>
        <h3>Saved Notes</h3>
        <div id="saved-notes"></div>
    </div>
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
        function saveNote() {
            const noteText = document.getElementById("note").value;
            if (noteText.trim() !== "") {
                const noteDiv = document.createElement("div");
                noteDiv.textContent = noteText;
                noteDiv.style.border = "1px solid var(--text-color)";
                noteDiv.style.padding = "10px";
                noteDiv.style.marginTop = "10px";
                document.getElementById("saved-notes").appendChild(noteDiv);
                document.getElementById("note").value = "";
            }
        }
        function goHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
